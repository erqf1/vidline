name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          cmake --build build
      - name: Package
        shell: pwsh
        run: |
          pip install imageio-ffmpeg
          $ff = python -c "import imageio_ffmpeg as i;print(i.get_ffmpeg_exe())"
          New-Item -ItemType Directory -Path dist/Vidline | Out-Null
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw --dir dist/Vidline build/Vidline.exe
          Copy-Item build/Vidline.exe, build/Cutline.exe dist/Vidline/
          Copy-Item $ff dist/Vidline/ffmpeg.exe
          Copy-Item -Recurse assets/filetypes dist/Vidline/filetypes
          Copy-Item LICENSE, README.md dist/Vidline/
          Compress-Archive -Path dist/Vidline -DestinationPath Vidline-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging/windows/vidline.iss
          Move-Item dist/Vidline-windows-x64-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Vidline-windows-x64.zip
            Vidline-windows-x64-setup.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev cmake ninja-build python3-venv dpkg-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          strip build/vidline
      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VER=0.0.0" >> "$GITHUB_ENV"; fi
      - name: deb package
        run: |
          DESTDIR="$PWD/pkg/deb" cmake --install build
          mkdir -p pkg/deb/DEBIAN
          {
            echo "Package: cutline"
            echo "Version: ${VER}"
            echo "Section: video"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Depends: libqt6widgets6, libqt6multimedia6, libqt6multimediawidgets6, libqt6network6, ffmpeg"
            echo "Recommends: gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
            echo "Maintainer: Vidline <noreply@users.noreply.github.com>"
            echo "Description: Simple, fast video editor"
            echo " Cut, speed up, blur, add images, videos and music, then export."
          } > pkg/deb/DEBIAN/control
          dpkg-deb --build --root-owner-group pkg/deb vidline_amd64.deb
      - name: tar.gz package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install imageio-ffmpeg
          FF=$(.venv/bin/python -c "import imageio_ffmpeg as i;print(i.get_ffmpeg_exe())")
          D=vidline-linux-x86_64
          mkdir "$D"
          cp build/vidline "$D/vidline"
          ln -s vidline "$D/cutline"  # alter Name für Updates aus Versionen vor der Umbenennung
          cp "$FF" "$D/ffmpeg"
          chmod +x "$D/ffmpeg"
          cp assets/icon.png assets/vidline.desktop packaging/linux/install.sh LICENSE README.md "$D/"
          tar czf vidline-linux-x86_64.tar.gz "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            vidline_amd64.deb
            vidline-linux-x86_64.tar.gz

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-multimedia qt6-multimedia-ffmpeg ffmpeg
      - uses: actions/checkout@v4
      - name: makepkg
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=arch step failed::line $LINENO: $BASH_COMMAND"' ERR
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0"; fi
          useradd -m builder
          mkdir /home/builder/pkg
          tar czf /home/builder/pkg/vidline-src.tar.gz --exclude=.git --exclude=build --exclude=dist --exclude=docs .
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          sed -i "s/^pkgver=.*/pkgver=${VER}/" /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          if ! su builder -c "makepkg -f --noconfirm" > /tmp/makepkg.log 2>&1; then
            tail -n 60 /tmp/makepkg.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
            echo "::error title=makepkg failed::$(cat /tmp/tail.txt)"
            exit 1
          fi
          cp cutline-[0-9]*-x86_64.pkg.tar.zst "$GITHUB_WORKSPACE/vidline-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: vidline-x86_64.pkg.tar.zst

  macos:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            name: intel
          - os: macos-15
            name: apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --parallel
      - name: Package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install imageio-ffmpeg
          FF=$(.venv/bin/python -c "import imageio_ffmpeg as i;print(i.get_ffmpeg_exe())")
          macdeployqt build/Vidline.app
          cp "$FF" build/Vidline.app/Contents/MacOS/ffmpeg
          chmod +x build/Vidline.app/Contents/MacOS/ffmpeg
          codesign --force --deep -s - build/Vidline.app
          mkdir dmg
          cp -R build/Vidline.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Vidline -srcfolder dmg -ov -format UDZO "Vidline-macos-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: Vidline-macos-${{ matrix.name }}.dmg

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    needs: [windows, linux, arch, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
